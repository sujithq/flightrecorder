name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore FlightRecorder.slnx

      - name: Build
        run: dotnet build FlightRecorder.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test FlightRecorder.slnx --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Build container image
        run: docker build --tag flightrecorder:ci .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
