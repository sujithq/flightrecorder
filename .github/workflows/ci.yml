name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    outputs:
      vsix-artifact:
        description: The exact validated VSIX and checksum artifact
        value: ${{ jobs.build-and-test.outputs.vsix-artifact }}

permissions:
  contents: read

jobs:
  extension-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Test local setup and compatibility
        run: >-
          node --test
          tests/integrations/extension-bundle.test.mjs
          tests/integrations/bundle-runtime-contract.test.mjs
          tests/integrations/local-recorder.test.mjs
          tests/integrations/setup-ui.test.mjs
          tests/integrations/mcp-provider.test.mjs
          tests/integrations/webview.test.mjs
          tests/integrations/client-defaults.test.mjs

  build-and-test:
    needs: extension-platforms
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      vsix-artifact: flight-recorder-vsix-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install viewer and integration tooling
        run: npm ci

      - name: Restore dependencies
        run: dotnet restore FlightRecorder.slnx --configfile NuGet.Config --artifacts-path artifacts/validation

      - name: Build viewer
        run: npm run build:web

      - name: Build
        run: dotnet build FlightRecorder.slnx --configuration Release --no-restore --artifacts-path artifacts/validation

      - name: Test
        run: dotnet test FlightRecorder.slnx --configuration Release --no-build --artifacts-path artifacts/validation --logger "trx;LogFileName=test-results.trx"

      - name: Test viewer and integrations
        run: npm test

      - name: Test badge decoder and layout
        run: npm run test:badger

      - name: Package VS Code extension
        run: npm run package:vscode

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile viewer
        run: npx playwright test

      - name: Build container image
        run: docker build --tag flightrecorder:ci --tag flightrecorder:local .

      - name: Test container trace persistence
        run: npm run test:persistence

      - name: Test the packaged VSIX in an isolated Docker installation
        run: npm run test:vsix-setup

      - name: Upload validated release package
        uses: actions/upload-artifact@v4
        with:
          name: flight-recorder-vsix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/*.vsix
            artifacts/*.vsix.sha256
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            artifacts/browser/
            artifacts/*.vsix
          if-no-files-found: ignore
