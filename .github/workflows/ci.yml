name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install viewer and integration tooling
        run: npm ci

      - name: Restore dependencies
        run: dotnet restore FlightRecorder.slnx --artifacts-path artifacts/validation

      - name: Build viewer
        run: npm run build:web

      - name: Build
        run: dotnet build FlightRecorder.slnx --configuration Release --no-restore --artifacts-path artifacts/validation

      - name: Test
        run: dotnet test FlightRecorder.slnx --configuration Release --no-build --artifacts-path artifacts/validation --logger "trx;LogFileName=test-results.trx"

      - name: Test viewer and integrations
        run: npm test

      - name: Test badge decoder and layout
        run: npm run test:badger

      - name: Package VS Code extension
        run: npm run package:vscode

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Test desktop and mobile viewer
        run: npx playwright test

      - name: Build container image
        run: docker build --tag flightrecorder:ci --tag flightrecorder:local .

      - name: Test container trace persistence
        run: npm run test:persistence

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/TestResults/*.trx
            artifacts/browser/
            artifacts/*.vsix
          if-no-files-found: ignore
