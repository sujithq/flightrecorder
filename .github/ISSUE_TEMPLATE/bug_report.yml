name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Do not include credentials, personal data, or sensitive trace payloads. Report vulnerabilities through the private security advisory link instead.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Start the API with...
        2. Call...
        3. Observe...
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Version or commit
      description: Commit SHA, branch, or release where the problem occurs.
    validations:
      required: true

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - REST API
        - MCP server
        - GitHub Copilot Chat in VS Code
        - GitHub Copilot CLI
        - Build or test tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, .NET SDK, client, and relevant configuration without secrets.
      render: text
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or trace
      description: Include only relevant output after removing secrets and personal information.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials, personal data, and sensitive payloads.
          required: true
        - label: This is not a security vulnerability.
          required: true
